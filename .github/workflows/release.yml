name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Check tag matches gem version
      run: |
        version=$(sed -nE 's/^ *VERSION = "([^"]+)".*/\1/p' lib/jekyll-ical-tag/version.rb)
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match gem version ${version} in lib/jekyll-ical-tag/version.rb"
          exit 1
        fi
        echo "Releasing version ${version}"

  ci:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write # required for RubyGems trusted publishing (OIDC)
      contents: write # required by `rake release` to push the release tag

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - uses: rubygems/release-gem@v1
